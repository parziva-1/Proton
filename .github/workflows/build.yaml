name: Proton Docker Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - proton-main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build kernel (Docker defconfig, no Telegram, no KSU)
        run: |
          export WP="$(realpath "$PWD/../")"
          bash build/ckbuild.sh -cR

      - name: Upload kernel zip (AnyKernel3, flashable)
        uses: actions/upload-artifact@v4
        with:
          name: proton-docker-kernel
          path: build/ProtonPlus-*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
          if-no-files-found: warn
