name: "Build"

on:
  push:
    branches: ["proton-new"]

jobs:
  building:
    runs-on: ubuntu-latest
    steps:
         - uses: actions/checkout@v4
         - run: export WP="$(realpath $PWD/../)"
         - run: export WP="$(realpath $PWD/../)"; bash build/ckbuild_actions.sh -tkR
         - run: export WP="$(realpath $PWD/../)"; bash build/ckbuild_actions.sh -tR